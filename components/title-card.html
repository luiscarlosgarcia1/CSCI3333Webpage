<style>
  :root {
    --forest-950: #174b3c;
    --forest-900: #2d6552;
    --mint-100: #d3e5d8;
    --mint-200: #b0cdb9;
    --ink: #171717;
    --muted: #626262;
    --white: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    color: var(--ink);
    background: var(--mint-100);
    font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
  }

  .course-header {
    display: grid;
    justify-items: center;
    width: 100%;
    padding: clamp(1rem, 3vw, 1.75rem) clamp(1.25rem, 5vw, 4rem)
      clamp(0.7rem, 1.75vw, 1rem);
    overflow: hidden;
    color: var(--white);
    text-align: center;
    background: var(--forest-950);
  }

  .course-header__content {
    width: min(100%, 70rem);
  }

  .course-header h1 {
    margin: 0 0 0.2rem;
    font-size: clamp(1.65rem, 3.75vw, 2.7rem);
    font-weight: 700;
    font-variant-numeric: lining-nums;
    line-height: 1;
    letter-spacing: -0.045em;
  }

  .course-name {
    margin: 0;
    color: rgba(255, 255, 255, 0.72);
    font-size: clamp(0.95rem, 1.8vw, 1.15rem);
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  .course-update {
    margin: 1.1rem 0 0;
    color: rgba(255, 255, 255, 0.82);
    font-size: clamp(0.78rem, 1.25vw, 0.9rem);
    line-height: 1.45;
  }

  @media (max-width: 640px) {
    .course-header {
      padding-inline: 1rem;
    }

  }
</style>

<header class="course-header" aria-labelledby="course-title">
  <div class="course-header__content">
    <h1 id="course-title">TA Resources</h1>
    <p class="course-name">For Data Structures and Algorithms</p>
    <p class="course-update">This page will &mdash; <em>hopefully</em> &mdash; be updated every Friday.</p>
  </div>
</header>
