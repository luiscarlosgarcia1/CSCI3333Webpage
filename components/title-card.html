<style>
  :root {
    --forest-950: #174b3c;
    --forest-900: #2d6552;
    --mint-100: #d3e5d8;
    --mint-200: #b0cdb9;
    --ink: #171717;
    --muted: #626262;
    --white: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    color: var(--ink);
    background: var(--mint-100);
    font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
  }

  .course-header {
    display: grid;
    justify-items: center;
    width: 100%;
    padding: clamp(1rem, 3vw, 1.75rem) clamp(1.25rem, 5vw, 4rem)
      clamp(1.15rem, 3vw, 1.85rem);
    overflow: hidden;
    color: var(--white);
    text-align: center;
    background: var(--forest-950);
  }

  .course-header__content {
    width: min(100%, 70rem);
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.65rem;
    margin: 0;
    color: rgba(255, 255, 255, 0.72);
    font-size: clamp(0.72rem, 1.6vw, 0.9rem);
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .eyebrow::before {
    width: 0.62rem;
    height: 0.62rem;
    content: "";
    border-radius: 50%;
    background: var(--mint-200);
    box-shadow: 0 0 0 0.3rem rgba(205, 229, 211, 0.14);
  }

  .course-header h1 {
    margin: 0.4rem 0 0.2rem;
    font-size: clamp(1.85rem, 4.5vw, 3.2rem);
    font-weight: 700;
    font-variant-numeric: lining-nums;
    line-height: 1;
    letter-spacing: -0.045em;
  }

  .course-name {
    margin: 0;
    color: rgba(255, 255, 255, 0.72);
    font-size: clamp(0.95rem, 1.8vw, 1.15rem);
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  .course-highlights {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(0.75rem, 2vw, 1.25rem);
    width: min(100%, 62rem);
    margin: clamp(0.85rem, 2vw, 1.25rem) auto 0;
  }

  .course-highlight {
    min-height: 6.25rem;
    padding: 0.9rem 1.1rem;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 0.9rem;
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 1rem 2.25rem rgba(0, 0, 0, 0.1);
  }

  .course-highlight__label {
    margin: 0 0 0.4rem;
    color: rgba(255, 255, 255, 0.7);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
  }

  .course-highlight__value {
    margin: 0;
    font-size: clamp(0.95rem, 1.6vw, 1.08rem);
    font-weight: 600;
    line-height: 1.45;
  }

  @media (max-width: 640px) {
    .course-header {
      padding-inline: 1rem;
    }

    .course-highlights {
      grid-template-columns: 1fr;
      width: min(100%, 25rem);
    }

    .course-highlight {
      min-height: 0;
    }
  }
</style>

<header class="course-header" aria-labelledby="course-title">
  <div class="course-header__content">
    <p class="eyebrow">Maintained by Luis Garcia</p>
    <h1 id="course-title">TA Resources</h1>
    <p class="course-name">For Data Structures and Algorithms</p>

    <section class="course-highlights" aria-label="Course information">
      <article class="course-highlight">
        <p class="course-highlight__label">Quick reminder</p>
        <p class="course-highlight__value">Go to class, do ya homework, and ask questions!!!</p>
      </article>
      <article class="course-highlight">
        <p class="course-highlight__label">Stay connected</p>
        <p class="course-highlight__value">Bookmark this and Dr. Schweller's page so they're easy to access.</p>
      </article>
      <article class="course-highlight">
        <p class="course-highlight__label">Weekly updates</p>
        <p class="course-highlight__value">This page will <em>hopefully</em> be updated every Friday.</p>
      </article>
    </section>
  </div>
</header>
