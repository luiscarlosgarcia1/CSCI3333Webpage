<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSCI 3333 | Data Structures and Algorithms</title>
</head>
<body>
  <div id="title-card"></div>
  <div id="course-outline"></div>
  <script>
    const components = [
      ["#title-card", "components/title-card.html"],
      ["#course-outline", "components/course-outline.html"],
    ];

    Promise.all(components.map(async ([selector, path]) => {
      const response = await fetch(path);
      if (!response.ok) throw new Error(`Could not load ${path}.`);
      document.querySelector(selector).innerHTML = await response.text();
    }))
      .then(() => initializeWeekAccordions())
      .catch((error) => console.error(error));

    async function initializeWeekAccordions() {
      const weeks = document.querySelectorAll(".week-strip");

      await Promise.all([...weeks].map(async (week, index) => {
        const trigger = document.createElement("div");
        const panel = document.createElement("div");
        const panelId = `week-resources-${index + 1}`;

        trigger.className = "week-strip__trigger";
        trigger.setAttribute("role", "button");
        trigger.tabIndex = 0;
        trigger.setAttribute("aria-expanded", "false");
        trigger.setAttribute("aria-controls", panelId);

        while (week.firstChild) trigger.appendChild(week.firstChild);

        panel.id = panelId;
        panel.className = "week-strip__panel";
        panel.hidden = true;

        if (week.dataset.resourcePath) {
          const response = await fetch(week.dataset.resourcePath);
          if (!response.ok) {
            throw new Error(`Could not load ${week.dataset.resourcePath}.`);
          }
          panel.innerHTML = await response.text();
        }

        if (!panel.childElementCount && !panel.textContent.trim()) {
          panel.textContent = "Nothing to see here for now!";
          panel.classList.add("week-strip__panel--empty");
        }

        const togglePanel = () => {
          const opening = trigger.getAttribute("aria-expanded") === "false";

          weeks.forEach((otherWeek) => {
            const otherTrigger = otherWeek.querySelector(".week-strip__trigger");
            const otherPanel = otherWeek.querySelector(".week-strip__panel");
            otherTrigger.setAttribute("aria-expanded", "false");
            otherPanel.hidden = true;
          });

          trigger.setAttribute("aria-expanded", String(opening));
          panel.hidden = !opening;
        };

        trigger.addEventListener("click", togglePanel);
        trigger.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            togglePanel();
          }
        });

        week.append(trigger, panel);
      }));
    }
  </script>
</body>
</html>
